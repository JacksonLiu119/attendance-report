<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>出勤與請假管理報表</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root{--ink:#1d2939;--muted:#667085;--line:#e4e7ec;--bg:#f6f8fb;--card:#fff;--brand:#175cd3;--brand2:#0b4a9e;--warn:#f79009;--danger:#d92d20;--ok:#039855}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
    .shell{max-width:1440px;margin:auto;padding:28px 30px 50px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--brand);font-weight:700;letter-spacing:.08em;font-size:12px}.title{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:4px 0}.sub{color:var(--muted);margin:0}.upload{background:#eef4ff;border:1px solid #c7d7fe;border-radius:12px;padding:11px 15px;color:var(--brand);font-weight:700;cursor:pointer;white-space:nowrap}.upload input{display:none}
    .notice{display:none;margin:0 0 16px;padding:11px 14px;border-radius:10px;background:#ecfdf3;color:#067647;border:1px solid #abefc6}.notice.show{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px #1018280d}.card{padding:18px 20px}.label{color:var(--muted);font-size:13px}.metric{font-size:28px;font-weight:800;margin-top:5px}.metric small{font-size:13px;font-weight:500;color:var(--muted)}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-bottom:18px}.panel{padding:20px}.panel h2{font-size:17px;margin:0 0 4px}.hint{color:var(--muted);font-size:12px;margin:0 0 14px}.table-wrap{overflow:auto;max-height:470px;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:540px;background:#fff}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#f9fafb;color:#475467;font-weight:700;position:sticky;top:0;z-index:1}td.num,th.num{text-align:right}tr:last-child td{border-bottom:0}.bar-row{display:grid;grid-template-columns:100px 1fr 55px;align-items:center;gap:10px;margin:14px 0}.bar{height:9px;background:#edf2f7;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2e90fa,#175cd3);border-radius:9px}.empty{padding:35px 15px;text-align:center;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}.search{border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:230px;font:inherit}.badge{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:12px;background:#fff4e5;color:#b54708}.footer{color:var(--muted);font-size:12px;margin-top:13px}@media(max-width:900px){.shell{padding:20px 14px}.top{display:block}.upload{display:inline-block;margin-top:14px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.metric{font-size:23px}.search{width:150px}}
  </style>
</head>
<body>
<main class="shell">
  <div class="top"><div><div class="eyebrow">MANAGEMENT REPORT</div><div class="title">出勤與請假管理報表</div><p class="sub" id="period">上傳 Excel 後，自動整理人員遲到與各假別統計</p></div><label class="upload">選擇 Excel 檔案<input id="file" type="file" accept=".xlsx,.xls,.csv" /></label></div>
  <div id="notice" class="notice"></div>
  <section class="cards"><div class="card"><div class="label">統計人員</div><div class="metric" id="people">— <small>人</small></div></div><div class="card"><div class="label">遲到總次數</div><div class="metric" id="late">— <small>次</small></div></div><div class="card"><div class="label">請假總時數</div><div class="metric" id="hours">— <small>小時</small></div></div><div class="card"><div class="label">請假總次數</div><div class="metric" id="leaves">— <small>次</small></div></div></section>
  <div class="grid"><section class="panel"><h2>人員出勤摘要</h2><p class="hint">依遲到次數排序，方便快速掌握需要關注的人員</p><div class="table-wrap"><table><thead><tr><th>人員</th><th>工號</th><th class="num">遲到次數</th><th class="num">請假時數</th><th class="num">請假次數</th></tr></thead><tbody id="peopleRows"><tr><td colspan="5" class="empty">請先上傳出勤 Excel</td></tr></tbody></table></div></section>
  <section class="panel"><h2>假別統計</h2><p class="hint">同一假別合併計算時數與申請次數</p><div id="leaveBars"><div class="empty">請先上傳出勤 Excel</div></div></section></div>
  <section class="panel"><div class="toolbar"><div><h2>遲到明細</h2><p class="hint" style="margin:2px 0 0">可搜尋人員、日期或狀態</p></div><input class="search" id="search" placeholder="搜尋…" /></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>人員</th><th>工號</th><th>上班時間</th><th>狀態</th></tr></thead><tbody id="lateRows"><tr><td colspan="5" class="empty">上傳後顯示遲到紀錄</td></tr></tbody></table></div><div class="footer" id="source">資料來源：尚未上傳</div></section>
</main>
<script>
const $=id=>document.getElementById(id);let state={lateRows:[],people:[],leave:[]};
const norm=s=>String(s??'').replace(/\s/g,'').toLowerCase();
function find(headers,keys,fallback){let i=headers.findIndex(h=>keys.some(k=>norm(h).includes(norm(k))));return i<0?fallback:i}
function num(v){if(v==null||v==='')return 0;let n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:0}
function parse(rows){const headers=rows[0]||[];const idx={dept:find(headers,['部門','單位'],0),id:find(headers,['工號','員工編號','代號'],1),name:find(headers,['姓名','名稱','人員'],2),date:find(headers,['日期','出勤日期'],5),status:find(headers,['出勤狀態','狀態','班別'],6),in:find(headers,['上班時間','上班打卡','到勤時間'],7),leaveType:find(headers,['假別','請假類別'],11),leaveHours:find(headers,['請假時數','請假時數'],12),leaveCount:find(headers,['請假次數','請假'],13)};let peopleMap=new Map(), leaveMap=new Map(), late=[];
  rows.slice(1).forEach(r=>{if(!r||!r.length)return;let name=String(r[idx.name]??'').trim()||'未命名',id=String(r[idx.id]??'').trim(),status=String(r[idx.status]??'').trim(),type=String(r[idx.leaveType]??'').trim(),lh=num(r[idx.leaveHours]),lc=num(r[idx.leaveCount]);let p=peopleMap.get(id+'|'+name)||{name,id,late:0,hours:0,count:0};let lateHit=/遲|遲到|晚到|late/i.test(status)||(!/休|假|公休|例假|曠|缺勤|未打卡/.test(status)&&/^\d{1,2}:\d{2}$/.test(String(r[idx.in]??''))&&String(r[idx.in]).localeCompare('08:30')>0);if(lateHit){p.late++;late.push({date:String(r[idx.date]??''),name,id,time:String(r[idx.in]??''),status:status||'遲到'});}if(lh||lc||type){if(!type)type='未分類';p.hours+=lh;p.count+=lc||1;let x=leaveMap.get(type)||{type,hours:0,count:0};x.hours+=lh;x.count+=lc||1;leaveMap.set(type,x)}peopleMap.set(id+'|'+name,p)});state={lateRows:late,people:[...peopleMap.values()].sort((a,b)=>b.late-a.late||b.hours-a.hours),leave:[...leaveMap.values()].sort((a,b)=>b.hours-a.hours)};render()}
function render(){let ps=state.people,ls=state.leave;$("people").innerHTML=ps.length+' <small>人</small>';$('late').innerHTML=state.lateRows.length+' <small>次</small>';$('hours').innerHTML=ls.reduce((a,x)=>a+x.hours,0).toFixed(1)+' <small>小時</small>';$('leaves').innerHTML=ls.reduce((a,x)=>a+x.count,0)+' <small>次</small>';$("peopleRows").innerHTML=ps.length?ps.map(p=>`<tr><td>${p.name}</td><td>${p.id}</td><td class="num">${p.late}</td><td class="num">${p.hours.toFixed(1)}</td><td class="num">${p.count}</td></tr>`).join(''):`<tr><td colspan="5" class="empty">沒有可辨識的紀錄</td></tr>`;let max=Math.max(...ls.map(x=>x.hours),1);$('leaveBars').innerHTML=ls.length?ls.map(x=>`<div class="bar-row"><span>${x.type}</span><div class="bar"><i style="width:${x.hours/max*100}%"></i></div><strong>${x.hours.toFixed(1)}h · ${x.count}次</strong></div>`).join(''):'<div class="empty">沒有請假資料</div>';drawLate()}
function drawLate(){let q=norm($('search').value);let a=state.lateRows.filter(x=>[x.date,x.name,x.id,x.time,x.status].some(v=>norm(v).includes(q)));$('lateRows').innerHTML=a.length?a.map(x=>`<tr><td>${x.date}</td><td>${x.name}</td><td>${x.id}</td><td>${x.time||'—'}</td><td><span class="badge">${x.status}</span></td></tr>`).join(''):'<tr><td colspan="5" class="empty">沒有符合的遲到紀錄</td></tr>'}
$("file").addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=ev=>{try{let wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});let ws=wb.Sheets[wb.SheetNames[0]];let rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});parse(rows);$('period').textContent=`${f.name} · 已讀取 ${Math.max(rows.length-1,0).toLocaleString()} 筆紀錄`;$('source').textContent='資料來源：'+f.name;$('notice').textContent='報表已更新，可直接提供主管查看。';$('notice').classList.add('show')}catch(err){$('notice').textContent='檔案讀取失敗，請確認是有效的 Excel 檔案。';$('notice').style.background='#fef3f2';$('notice').style.color='#b42318';$('notice').classList.add('show')}};reader.readAsArrayBuffer(f)});$('search').addEventListener('input',drawLate);
</script>
<script>
document.querySelector('#file').addEventListener('change', async e=>{const f=e.target.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}), rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});const byType=new Map();rows.slice(1).forEach(r=>{const type=String(r[11]??'').trim()||'未分類', name=String(r[2]??'').trim()||'未命名', id=String(r[1]??'').trim(), h=num(r[12]), c=num(r[13])||1;if(!String(r[11]??'').trim()&&!h&&!num(r[13]))return;let t=byType.get(type)||new Map(), k=id+'|'+name, p=t.get(k)||{name,id,h:0,c:0};p.h+=h;p.c+=c;t.set(k,p);byType.set(type,t)});document.querySelectorAll('.bar-row').forEach((el,i)=>{const type=el.children[0]?.textContent, people=byType.get(type);if(!people)return;let d=document.createElement('div');d.className='leave-detail';d.innerHTML='<table><thead><tr><th>人員</th><th>工號</th><th>時數</th><th>次數</th></tr></thead><tbody>'+[...people.values()].sort((a,b)=>b.h-a.h).map(p=>`<tr><td>${p.name}</td><td>${p.id}</td><td>${p.h.toFixed(1)}</td><td>${p.c}</td></tr>`).join('')+'</tbody></table>';el.appendChild(d);el.style.gridTemplateColumns='100px 1fr auto';el.addEventListener('click',()=>el.classList.toggle('open'))})});
</script>
<style>.bar-row{cursor:pointer;padding:7px 8px;border-radius:9px}.bar-row:hover{background:#f5f8ff}.leave-detail{grid-column:1/-1;display:none;border-top:1px solid var(--line);padding-top:7px}.bar-row.open .leave-detail{display:block}.leave-detail table{min-width:0;font-size:13px}.leave-detail th,.leave-detail td{padding:6px 8px}</style>
<script>document.querySelector('#leaveBars').addEventListener('click',e=>{const row=e.target.closest('.bar-row');if(row&&e.target.closest('#leaveBars'))row.classList.toggle('open')});</script>
</body></html>
