<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>出勤與請假管理報表</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root{--ink:#1d2939;--muted:#667085;--line:#e4e7ec;--bg:#f6f8fb;--card:#fff;--brand:#175cd3;--warn:#f79009}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
    .shell{max-width:1440px;margin:auto;padding:28px 30px 50px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--brand);font-weight:700;letter-spacing:.08em;font-size:12px}.title{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:4px 0}.sub{color:var(--muted);margin:0}.upload{background:#eef4ff;border:1px solid #c7d7fe;border-radius:12px;padding:11px 15px;color:var(--brand);font-weight:700;cursor:pointer;white-space:nowrap}.upload input{display:none}
    .notice{display:none;margin:0 0 16px;padding:11px 14px;border-radius:10px;background:#ecfdf3;color:#067647;border:1px solid #abefc6}.notice.show{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px #1018280d}.card{padding:18px 20px}.label{color:var(--muted);font-size:13px}.metric{font-size:28px;font-weight:800;margin-top:5px}.metric small{font-size:13px;font-weight:500;color:var(--muted)}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-bottom:18px}.panel{padding:20px}.panel h2{font-size:17px;margin:0 0 4px}.hint{color:var(--muted);font-size:12px;margin:0 0 14px}.table-wrap{overflow:auto;max-height:470px;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:540px;background:#fff}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#f9fafb;color:#475467;font-weight:700;position:sticky;top:0;z-index:1}td.num,th.num{text-align:right}tr:last-child td{border-bottom:0}
    .leave-row{display:grid;grid-template-columns:100px 1fr auto;align-items:center;gap:10px;margin:8px 0;padding:8px;border:1px solid transparent;border-radius:10px}.leave-row:hover,.leave-row.open{border-color:#dbe7ff;background:#f8faff}.leave-name{font-weight:600}.bar{height:9px;background:#edf2f7;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2e90fa,#175cd3);border-radius:9px}.leave-summary{font-weight:700;white-space:nowrap}.leave-toggle{grid-column:1/-1;justify-self:start;border:0;background:transparent;color:var(--brand);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:2px 0}.leave-toggle::before{content:'＋';display:inline-block;width:18px}.leave-row.open .leave-toggle::before{content:'－'}.leave-detail{grid-column:1/-1;display:none;border-top:1px solid var(--line);padding:10px 0 0 20px;margin-top:2px}.leave-row.open .leave-detail{display:block}.leave-detail table{min-width:0;font-size:13px}.leave-detail th,.leave-detail td{padding:7px 8px}.empty{padding:35px 15px;text-align:center;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}.search{border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:230px;font:inherit}.badge{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:12px;background:#fff4e5;color:#b54708}.footer{color:var(--muted);font-size:12px;margin-top:13px}
    @media(max-width:900px){.shell{padding:20px 14px}.top{display:block}.upload{display:inline-block;margin-top:14px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:480px){.metric{font-size:23px}.search{width:150px}.leave-row{grid-template-columns:82px 1fr auto}.leave-summary{font-size:13px}}
  </style>
</head>
<body>
<main class="shell">
  <div class="top"><div><div class="eyebrow">MANAGEMENT REPORT</div><div class="title">出勤與請假管理報表</div><p class="sub" id="period">上傳 Excel 後，自動整理人員遲到與各假別統計</p></div><label class="upload">選擇 Excel 檔案<input id="file" type="file" accept=".xlsx,.xls,.csv" /></label></div>
  <div id="notice" class="notice"></div>
  <section class="cards"><div class="card"><div class="label">統計人員</div><div class="metric" id="people">— <small>人</small></div></div><div class="card"><div class="label">遲到總次數</div><div class="metric" id="late">— <small>次</small></div></div><div class="card"><div class="label">請假總時數</div><div class="metric" id="hours">— <small>小時</small></div></div><div class="card"><div class="label">請假總次數</div><div class="metric" id="leaves">— <small>次</small></div></div></section>
  <div class="grid"><section class="panel"><h2>人員出勤摘要</h2><p class="hint">依遲到次數排序，方便快速掌握需要關注的人員</p><div class="table-wrap"><table><thead><tr><th>人員</th><th>工號</th><th class="num">遲到次數</th><th class="num">請假時數</th><th class="num">請假次數</th></tr></thead><tbody id="peopleRows"><tr><td colspan="5" class="empty">請先上傳出勤 Excel</td></tr></tbody></table></div></section>
  <section class="panel"><h2>假別統計</h2><p class="hint">點擊「展開明細」查看人員，再點擊「收合明細」即可縮回</p><div id="leaveBars"><div class="empty">請先上傳出勤 Excel</div></div></section></div>
  <section class="panel"><div class="toolbar"><div><h2>遲到明細</h2><p class="hint" style="margin:2px 0 0">可搜尋人員、日期或狀態</p></div><input class="search" id="search" placeholder="搜尋…" /></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>人員</th><th>工號</th><th>上班時間</th><th>狀態</th></tr></thead><tbody id="lateRows"><tr><td colspan="5" class="empty">上傳後顯示遲到紀錄</td></tr></tbody></table></div><div class="footer" id="source">資料來源：尚未上傳</div></section>
</main>
<script>
const $=id=>document.getElementById(id);let state={lateRows:[],people:[],leave:[]};
const norm=s=>String(s??'').replace(/\s/g,'').toLowerCase();
function find(headers,keys,fallback){let i=headers.findIndex(h=>keys.some(k=>norm(h).includes(norm(k))));return i<0?fallback:i}
function num(v){if(v==null||v==='')return 0;let n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:0}
function safe(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function parse(rows){const headers=rows[0]||[];const idx={id:find(headers,['工號','員工編號','代號'],1),name:find(headers,['姓名','名稱','人員'],2),date:find(headers,['日期','出勤日期'],5),status:find(headers,['出勤狀態','狀態','班別'],6),in:find(headers,['上班時間','上班打卡','到勤時間'],7),leaveType:find(headers,['假別','請假類別'],11),leaveHours:find(headers,['請假時數'],12),leaveCount:find(headers,['請假次數','請假'],13)};let peopleMap=new Map(),leaveMap=new Map(),late=[];
  rows.slice(1).forEach(r=>{if(!r||!r.length)return;let name=String(r[idx.name]??'').trim()||'未命名',id=String(r[idx.id]??'').trim(),status=String(r[idx.status]??'').trim(),type=String(r[idx.leaveType]??'').trim(),lh=num(r[idx.leaveHours]),lc=num(r[idx.leaveCount]);let key=id+'|'+name,p=peopleMap.get(key)||{name,id,late:0,hours:0,count:0};let tm=String(r[idx.in]??'');let lateHit=/遲|遲到|晚到|late/i.test(status)||(!/休|假|公休|例假|曠|缺勤|未打卡/.test(status)&&/^\d{1,2}:\d{2}$/.test(tm)&&tm.localeCompare('08:30')>0);if(lateHit){p.late++;late.push({date:String(r[idx.date]??''),name,id,time:tm,status:status||'遲到'})}if(lh||lc||type){if(!type)type='未分類';p.hours+=lh;p.count+=lc||1;let x=leaveMap.get(type)||{type,hours:0,count:0,people:new Map()};x.hours+=lh;x.count+=lc||1;let q=x.people.get(key)||{name,id,hours:0,count:0};q.hours+=lh;q.count+=lc||1;x.people.set(key,q);leaveMap.set(type,x)}peopleMap.set(key,p)});state={lateRows:late,people:[...peopleMap.values()].sort((a,b)=>b.late-a.late||b.hours-a.hours),leave:[...leaveMap.values()].sort((a,b)=>b.hours-a.hours)};render()}
function render(){let ps=state.people,ls=state.leave;$('people').innerHTML=ps.length+' <small>人</small>';$('late').innerHTML=state.lateRows.length+' <small>次</small>';$('hours').innerHTML=ls.reduce((a,x)=>a+x.hours,0).toFixed(1)+' <small>小時</small>';$('leaves').innerHTML=ls.reduce((a,x)=>a+x.count,0)+' <small>次</small>';$('peopleRows').innerHTML=ps.length?ps.map(p=>`<tr><td>${safe(p.name)}</td><td>${safe(p.id)}</td><td class="num">${p.late}</td><td class="num">${p.hours.toFixed(1)}</td><td class="num">${p.count}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">沒有可辨識的紀錄</td></tr>';let max=Math.max(...ls.map(x=>x.hours),1);$('leaveBars').innerHTML=ls.length?ls.map(x=>`<div class="leave-row"><span class="leave-name">${safe(x.type)}</span><div class="bar"><i style="width:${x.hours/max*100}%"></i></div><strong class="leave-summary">${x.hours.toFixed(1)}h · ${x.count}次</strong><button type="button" class="leave-toggle">展開明細</button><div class="leave-detail"><table><thead><tr><th>人員</th><th>工號</th><th class="num">時數</th><th class="num">次數</th></tr></thead><tbody>${[...x.people.values()].sort((a,b)=>b.hours-a.hours).map(p=>`<tr><td>${safe(p.name)}</td><td>${safe(p.id)}</td><td class="num">${p.hours.toFixed(1)}</td><td class="num">${p.count}</td></tr>`).join('')}</tbody></table></div></div>`).join(''):'<div class="empty">沒有請假資料</div>';drawLate()}
function drawLate(){let q=norm($('search').value),a=state.lateRows.filter(x=>[x.date,x.name,x.id,x.time,x.status].some(v=>norm(v).includes(q)));$('lateRows').innerHTML=a.length?a.map(x=>`<tr><td>${safe(x.date)}</td><td>${safe(x.name)}</td><td>${safe(x.id)}</td><td>${safe(x.time)||'—'}</td><td><span class="badge">${safe(x.status)}</span></td></tr>`).join(''):'<tr><td colspan="5" class="empty">沒有符合的遲到紀錄</td></tr>'}
$('leaveBars').addEventListener('click',e=>{let b=e.target.closest('.leave-toggle');if(!b)return;let row=b.closest('.leave-row'),open=row.classList.toggle('open');b.textContent=open?'收合明細':'展開明細'});$('search').addEventListener('input',drawLate);$('file').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=ev=>{try{let wb=XLSX.read(ev.target.result,{type:'array',cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});parse(rows);$('period').textContent=`${f.name} · 已讀取 ${Math.max(rows.length-1,0).toLocaleString()} 筆紀錄`;$('source').textContent='資料來源：'+f.name;$('notice').textContent='報表已更新，可直接提供主管查看。';$('notice').className='notice show'}catch(err){$('notice').textContent='檔案讀取失敗，請確認是有效的 Excel 檔案。';$('notice').style.background='#fef3f2';$('notice').style.color='#b42318';$('notice').className='notice show'}};reader.readAsArrayBuffer(f)});
</script>
</body>
</html>
